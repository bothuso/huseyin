<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hüseyin</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      max-width: 380px;
      width: 90%;
    }
    h1 { margin-top: 0; font-size: 22px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .btn {
      display: block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hoş Geldiniz</h1>
    <p>Bağlantıya gitmek için aşağıdaki butona tıklayın.</p>
    <!-- GİDİLECEK SİTEYİ AŞAĞIYA YAZIN -->
    <a href="https://google.com" class="btn" target="_blank">Siteye Git &rarr;</a>
  </div>
</body>
</html>
